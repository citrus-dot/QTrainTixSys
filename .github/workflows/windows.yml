name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-msvc:
    # Qt 6.5.x headers use stdext::checked_array_iterator, which was removed in
    # MSVC 14.51 (VS 18, current windows-latest image). Pin to the VS 2022 image.
    runs-on: windows-2022
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.5
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: win64_msvc2019_64

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G "Ninja" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Dump failure log to issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Get-Content build.log -Tail 400 | Out-File -FilePath body.log -Encoding utf8
          Get-Content body.log -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          gh issue create --repo $env:GITHUB_REPOSITORY --title "Windows build failure ($env:GITHUB_SHA)" --body-file body.log
