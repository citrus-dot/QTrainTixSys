name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-msvc:
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.5
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: win64_msvc2019_64

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G "Ninja" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Dump failure log to issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run view $env:GITHUB_RUN_ID --log-failed --repo $env:GITHUB_REPOSITORY > failed.log
          $tail = (Get-Content failed.log -Tail 400) -join "`n"
          $tail | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          gh issue create --repo $env:GITHUB_REPOSITORY --title "Windows build failure ($env:GITHUB_SHA)" --body $tail
